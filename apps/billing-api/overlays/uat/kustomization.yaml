apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: billing-api-uat
resources:
  - ../../base
images:
  - name: billing-api
    newName: nddemodevops2dcfe2.azurecr.io/billing-api
    newTag: "4ba2a84"
patches:
  - path: release-patch.yaml
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: billing-api}
      spec:
        template:
          spec:
            containers:
              - name: billing-api
                env:
                  - {name: ENVIRONMENT, value: uat}
