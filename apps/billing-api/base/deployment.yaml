apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  labels:
    app: billing-api
    backstage.io/kubernetes-id: billing-api
    owner: claims-team
    dr-tier: bronze
spec:
  replicas: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels: {app: billing-api}
  template:
    metadata:
      labels: {app: billing-api, backstage.io/kubernetes-id: billing-api}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: billing-api}}}
      containers:
        - name: billing-api
          image: billing-api
          ports: [{containerPort: 8080}]
          env:
            - {name: ENVIRONMENT, value: base}
            - {name: FEATURE_FLAGS, value: none}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
