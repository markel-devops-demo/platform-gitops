# Wave -1: Argo CD waits for this to be Healthy before rolling the Deployment (wave 0).
# A missing Key Vault entry therefore blocks the release instead of breaking running pods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claims-api-cert
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  refreshInterval: 30s
  secretStoreRef: {kind: ClusterSecretStore, name: azure-keyvault}
  target: {name: claims-api-cert, creationPolicy: Owner}
  data:
    - secretKey: tls.crt
      remoteRef: {key: claims-api-cert}
