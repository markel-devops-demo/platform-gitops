# Used by the PR-preview ApplicationSet. Argo CD overrides namespace (claims-api-pr-N) and image tag per PR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claims-api-preview
resources:
  - ../../base
images:
  - name: claims-api
    newName: nddemodevops2dcfe2.azurecr.io/claims-api
    newTag: "latest"
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: claims-api, labels: {dr-tier: bronze}}
      spec:
        template:
          spec:
            containers:
              - name: claims-api
                env:
                  - {name: ENVIRONMENT, value: preview}
