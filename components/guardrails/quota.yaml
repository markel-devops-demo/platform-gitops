apiVersion: v1
kind: ResourceQuota
metadata: {name: team-quota}
spec:
  hard: {requests.cpu: "2", limits.memory: 4Gi, pods: "20"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults}
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {cpu: 20m, memory: 64Mi}
