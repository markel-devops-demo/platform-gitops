apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spike-environment
  title: Spike environment (auto-expires)
  description: Short-lived clone of a service's UAT for destructive testing or a temporary UAT2. Auto-approved, auto-deleted after the TTL.
  tags: [environment, ephemeral, self-service]
spec:
  owner: group:default/platform-team
  type: environment
  parameters:
    - title: Spike
      required: [name, app, ttlHours]
      properties:
        name:
          title: Spike name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,15}$'
          description: e.g. perf-test, uat2
        app:
          title: Service to clone (from UAT)
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter: {kind: Component, metadata.tags: golden-path}
            defaultKind: Component
        ttlHours:
          title: Delete after
          type: string
          default: "4"
          enum: ["1", "4", "8", "24", "48"]
          enumNames: ["1 hour", "4 hours", "8 hours", "1 day", "2 days"]
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter: {kind: Group}
  steps:
    - id: fetch
      name: Generate spike definition
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./spike
        values:
          name: ${{ parameters.name }}
          app: ${{ parameters.app | parseEntityRef | pick('name') }}
          ttlHours: ${{ parameters.ttlHours }}
          owner: ${{ (parameters.owner or 'group:default/claims-team') | parseEntityRef | pick('name') }}
    - id: pr
      name: Request environment (low-risk change, auto-approved by policy)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=markel-devops-demo&repo=platform-gitops
        branchName: spike/${{ parameters.name }}
        title: "Spike: ${{ parameters.name }} (${{ parameters.ttlHours }}h)"
        description: Self-service spike environment. Auto-merged because it only touches spikes/**. Expires after ${{ parameters.ttlHours }}h.
        sourcePath: ./spike
        targetPath: spikes/${{ parameters.name }}
  output:
    links:
      - {title: Request (auto-merges in ~30s), url: "${{ steps['pr'].output.remoteUrl }}"}
      - {title: "Environment URL (ready in ~2 min)", url: "https://${{ parameters.app | parseEntityRef | pick('name') }}-spike-${{ parameters.name }}.apps.nd.azure-na.mobb.cloud"}
