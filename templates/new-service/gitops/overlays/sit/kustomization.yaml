apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.name }}-sit
resources:
  - ../../base
images:
  - name: ${{ values.name }}
    newName: nddemodevops2dcfe2.azurecr.io/${{ values.name }}
    newTag: "bootstrap"
patches:
  - path: release-patch.yaml
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ${{ values.name }}}
      spec:
        template:
          spec:
            containers:
              - name: ${{ values.name }}
                env:
                  - {name: ENVIRONMENT, value: sit}
