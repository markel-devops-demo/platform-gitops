apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
    owner: ${{ values.owner }}
    dr-tier: ${{ values.drTier }}
spec:
  replicas: {% if values.drTier == 'bronze' %}2{% else %}3{% endif %}
  progressDeadlineSeconds: 120
  selector:
    matchLabels: {app: ${{ values.name }}}
  template:
    metadata:
      labels: {app: ${{ values.name }}, backstage.io/kubernetes-id: ${{ values.name }}}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: {% if values.drTier == 'bronze' %}ScheduleAnyway{% else %}DoNotSchedule{% endif %}, labelSelector: {matchLabels: {app: ${{ values.name }}}}}
      containers:
        - name: ${{ values.name }}
          image: ${{ values.name }}
          ports: [{containerPort: 8080}]
          env:
            - {name: ENVIRONMENT, value: base}
            - {name: FEATURE_FLAGS, value: none}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
