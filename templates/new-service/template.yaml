apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-path-service
  title: "Golden path: new service on ARO"
  description: Python service with CI (GitHub Actions → ACR), GitOps deployment to SIT + UAT, guardrails, Dev Spaces and catalog registration. Ready in minutes.
  tags: [recommended, python, aro, gitops]
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service
      required: [name, description, owner]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase, used for the repo, namespaces and URLs
          pattern: '^[a-z][a-z0-9-]{2,20}$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owning team
          type: string
          description: Gets edit rights in the namespaces and receives incident alerts
          ui:field: OwnerPicker
          ui:options:
            catalogFilter: {kind: Group}
    - title: Operational requirements
      required: [drTier, dataClass]
      properties:
        drTier:
          title: DR tier
          type: string
          default: bronze
          enum: [bronze, silver, gold]
          enumNames: ["Bronze: 2 replicas, daily backup", "Silver: 3 replicas across zones, hourly backup", "Gold: 3 replicas + cross-region DR"]
        dataClass:
          title: Data classification
          type: string
          default: internal
          enum: [public, internal, confidential]
  steps:
    - id: fetch-app
      name: Generate service from the golden path
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating: ['.github/workflows/*', 'app.py']
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner | parseEntityRef | pick('name') }}
          drTier: ${{ parameters.drTier }}
          dataClass: ${{ parameters.dataClass }}
    - id: publish-app
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: github.com?owner=markel-devops-demo&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        repoVisibility: public
        defaultBranch: main
        protectDefaultBranch: false
        topics: [golden-path]
    - id: fetch-gitops
      name: Generate GitOps manifests (namespaces, quota, RBAC, network policy)
      action: fetch:template
      input:
        url: ./gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner | parseEntityRef | pick('name') }}
          drTier: ${{ parameters.drTier }}
          dataClass: ${{ parameters.dataClass }}
    - id: onboard
      name: Open onboarding PR on platform-gitops (platform team approves)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=markel-devops-demo&repo=platform-gitops
        branchName: onboard-${{ parameters.name }}
        title: "Onboard ${{ parameters.name }} (${{ parameters.drTier }}, ${{ parameters.dataClass }})"
        description: |
          Generated by the **Golden path: new service on ARO** template.

          - Owner: `${{ parameters.owner }}`
          - DR tier: `${{ parameters.drTier }}` · Data classification: `${{ parameters.dataClass }}`
          - Creates namespaces `${{ parameters.name }}-sit` and `${{ parameters.name }}-uat` with quota, default-deny network policy and team RBAC.

          Merge to provision. Argo CD picks it up within 30 seconds.
        sourcePath: ./gitops
        targetPath: apps/${{ parameters.name }}
    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-app'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
        # GitHub discovery (org-wide, every minute) also ingests the repo, so a 409 here is harmless
        optional: true
  output:
    links:
      - {title: Repository, url: "${{ steps['publish-app'].output.remoteUrl }}"}
      - {title: Onboarding PR (merge to provision), url: "${{ steps['onboard'].output.remoteUrl }}"}
      - {title: Open in catalog, icon: catalog, entityRef: "component:default/${{ parameters.name }}"}
