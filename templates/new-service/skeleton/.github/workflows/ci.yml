# CI for every golden-path service (generic: uses the repository name).
#   pull_request → image pr-<N>-<sha7> → the preview ApplicationSet deploys it
#   push to main → build → test → push image <sha7> → call the platform's release API → Argo CD deploys to SIT
#
# CI owns build and test. It never edits platform-gitops: its last step is one call saying
# "version <sha7> is ready". Any CI system (e.g. Azure DevOps) or Octopus can make the same call.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
env:
  APP: ${{ github.event.repository.name }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            echo "tag=pr-${{ github.event.number }}-${sha:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build
        run: |
          docker build -f Containerfile --build-arg APP_VERSION=${{ steps.tag.outputs.tag }} \
            -t "${{ vars.ACR_LOGIN_SERVER }}/$APP:${{ steps.tag.outputs.tag }}" .
      - name: Test (start the container, check health and API)
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/$APP:${{ steps.tag.outputs.tag }}"
          docker run -d --name under-test -p 8080:8080 "$IMAGE" >/dev/null
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/healthz >/dev/null || { docker logs under-test; echo "::error::health check failed"; exit 1; }
          curl -fsS localhost:8080/api | grep -q '"version"' || { echo "::error::/api did not return a version"; exit 1; }
          docker rm -f under-test >/dev/null
          echo "### ✔ Tests passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Push to ACR
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/$APP:${{ steps.tag.outputs.tag }}"
          docker push -q "$IMAGE"
          echo "### Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://$APP-$APP-pr-${{ github.event.number }}.${{ vars.APPS_DOMAIN }}"
          gh pr comment ${{ github.event.number }} --repo "${{ github.repository }}" \
            --body "🚀 Preview environment for \`${{ steps.tag.outputs.tag }}\`: $url (live in ~1 min, deleted when this PR closes)" || true

  # The hand-off: CI's last step. One call to the platform's release API; the platform decides how to deploy.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Tell the platform this version is ready for SIT
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh api "repos/${{ vars.GITOPS_REPO }}/dispatches" -f event_type=release \
            -f "client_payload[app]=$APP" -f "client_payload[version]=$TAG" -f "client_payload[env]=sit"
          echo "### Release requested: \`$APP:$TAG\` → SIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Follow it: https://github.com/${{ vars.GITOPS_REPO }}/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"
